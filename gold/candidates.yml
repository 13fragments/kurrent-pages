  # and promoted into `candidates:` above (visual triage pending). The generic
  # "PH 10-II early-1914 Anlagen/Meldungen" placeholder is now realized by those 5 concrete files.

# ============================================================================
# NON-BUNDESARCHIV TARGETS
# These exist to break the single-institution / single-genre / single-period /
# single-demographic monoculture that BArch alone cannot fix. They directly
# satisfy freeze_constraints that no BArch source can: single_archive_cap,
# period_buckets, non_professional_hands, and several ecologies.
# ============================================================================
non_bundesarchiv_targets:
  - source: "Matricula (matricula-online.eu)"
    genre: "parish registers (Taufbuch / Traubuch / Sterbebuch)"
    priority: "highest"
    collections:
      - "Bistum Augsburg - 900+ parishes online, free (practically local)"
      - "Munich-Freising, Passau, Regensburg, Wuerzburg, Bamberg, Eichstaett"
      - "Landesarchiv Baden-Wuerttemberg - 3,483 units"
    target_strata:
      - table_registry
      - tidy_kurrent
      - ugly_kurrent
      - degraded_fraktur
    fixes_constraints:
      - period_buckets
      - non_professional_hands
      - single_archive_cap
      - bestaende
    reason: >
      One fix for the period, demographic, and genre axes simultaneously. Registry-table layout;
      a different priest's hand per parish per generation (enormous hand diversity per page
      downloaded); coverage reaching back to the 16th c.; essentially zero contamination (nobody
      publishes transcriptions of random Taufbuch pages). Bonus: the Augsburg digitizates are scans
      of decades-old MICROFILMS, adding a bitonal microfilm-artifact degradation category that BArch
      direct scans do not provide.
    plan: >
      2-3 parishes, a few pages each across DIFFERENT centuries (repairs period + demographic +
      genre at once). LANGUAGE GUARD: Catholic registers before ~1800 are often formulaic LATIN,
      not German - check language per parish/century before selection; prefer 19th-c. Catholic
      registers or post-1808 civil duplicates (German by construction). Protestant registers
      (usually German, older) live mostly on Archion = paywalled, not Matricula.
    contamination_flag: >
      very low at PAGE level (random parish pages are not published transcription targets), BUT
      entity-level caveat: FamilySearch and CompGen/DES have INDEXED (names/dates/places) large
      swaths of German parish registers, and entity recall/precision is a headline benchmark
      metric. Risk of those indexes reaching model training page-aligned is low - note per item,
      do not claim zero.

  - source: "Own family papers (private)"
    genre: "private correspondence / personal letters"
    priority: "deferred: violates sourcing_constraint - not digitized, no scanning resources"
    target_strata:
      - ugly_kurrent
      - suetterlin
    fixes_constraints:
      - non_professional_hands
      - single_archive_cap
    reason: >
      The most direct match to the genealogist / local-historian persona (VISION section 4).
      Rights held; zero contamination by construction; ordinary UNTRAINED hands; it literally IS
      the target use case. Deferred ONLY because it requires scanning; revisit if digitization
      becomes cheap (phone-camera pass). Digitized substitute below: Nachlass incoming
      correspondence.
    contamination_flag: "none by construction."
    rejected_alternative:
      source: "Europeana 1914-1918 crowdsourced collections"
      reason: >
        Many items carry volunteer transcriptions displayed right next to the scans online, so each
        item needs an individual contamination check. Family papers need none.

  - source: "Digitized Nachlaesse - INCOMING minor correspondence (state libraries, via Kalliope)"
    genre: "private correspondence / personal letters"
    priority: "high"
    target_strata:
      - ugly_kurrent
      - suetterlin
    fixes_constraints:
      - non_professional_hands
      - single_archive_cap
      - bestaende
    reason: >
      Already-digitized substitute for family papers. Letters TO a semi-famous Nachlass holder
      FROM ordinary people (farmers, wives, parishioners, petitioners) = untrained hands, women's
      hands, elderly hands - and nobody publishes transcriptions of incoming minor correspondence.
      Same "non-famous pages in famous files" trick already used within BArch, applied to the
      demographic axis. Locate via Kalliope, then the holding library's digital collections.
    contamination_flag: >
      low, per-Nachlass check: verify no scholarly correspondence edition covers INCOMING letters
      (editions usually print the famous person's outgoing side only).

  - source: "Landesarchiv Baden-Wuerttemberg digitized holdings (beyond Matricula)"
    genre: "probate inventories (Inventuren und Teilungen) / notarial-adjacent records"
    priority: "high"
    target_strata:
      - ugly_kurrent
      - tidy_kurrent
      - table_registry
    fixes_constraints:
      - period_buckets
      - non_professional_hands
      - single_archive_cap
      - bestaende
    reason: >
      The best pre-1850 non-parish genre: household-level notarial records (possessions, debts,
      heirs), village scribes' hands, 16th-19th c., huge digitized volume, free online. Exactly
      the notarial-record ecology named in the monoculture gap.
    plan: "1-2 inventories from OBSCURE Amtsorte; per-item contamination check mandatory."
    contamination_flag: >
      medium, per-item: LABW has cooperated with Transkribus on serial sources, and Wuerttemberg
      probate inventories carry research-project transcriptions (Tuebingen). Pick obscure
      localities and verify no published transcription before gold selection.

  - source: "Landesarchiv NRW digitized Personenstandsregister"
    genre: "civil registry duplicates (post-1874)"
    priority: "high"
    target_strata:
      - table_registry
      - tidy_kurrent
      - mixed_print_handwriting
    fixes_constraints:
      - non_professional_hands
      - single_archive_cap
      - bestaende
    reason: >
      The literal genealogist document (VISION section 4): pre-printed registry forms filled in by
      local registrars' hands, German by construction, free online. Pick ~1874-1900 volumes for
      Kurrent-era hands; small-town Standesaemter over cities for hand diversity.
    contamination_flag: >
      low-medium: partial CompGen/DES crowdsourced INDEXING exists (entity-level names/dates -
      same caveat as Matricula); full page-level transcription unlikely. Note per register chosen.


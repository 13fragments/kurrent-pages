generated_at: "2026-07-03"
purpose: >
  Page-level gold-set candidates for the German historical HTR benchmark (VISION section 11).
  Primary source WAS Bundesarchiv Invenio, deliberately extended beyond BArch to break the
  institution / genre / period / writer-demographic monoculture of the confirmed pool.
  UPDATE 2026-07-03: BArch is EXCLUDED from gold v1 (reuse permission unresolved - see
  decisions_log.barch_exclusion); gold v1 freezes from the non-BArch permissive pool only.

# --- How to read this file --------------------------------------------------
framing:
  strata_are: >
    script x layout ONLY (the 8 canonical VISION section 11 categories). A 30-50 page gold set
    cannot stratify on script x layout x period x institution x demographic without pretending to
    support per-cell statistics. So period, institution, and writer-demographic are enforced as
    freeze CONSTRAINTS below, not as strata dimensions.
  canonical_strata:
    - clean_fraktur   # DOWNGRADED to optional 2026-07-03 - see decisions_log.clean_fraktur_downgrade
    - degraded_fraktur
    - tidy_kurrent
    - ugly_kurrent
    - suetterlin
    - table_registry
    - marginalia
    - mixed_print_handwriting
  sourcing_constraint: >
    Already-digitized sources ONLY - no scanning resources available. Any target without an
    existing online Digitalisat is deferred by construction, regardless of how well it fits.

# --- Freeze constraints (auditable; gold set cannot freeze until all pass) ---
freeze_constraints:
  writer_cap: "<= 4 final gold pages per distinct writer/hand."
  distinct_hands: >
    >= 15-20 distinct Kurrent/Suetterlin hands, diverse across period + provenance + training
    (NOT 15 WWI army clerks: count is not the goal, writing-culture diversity is).
  military_cap: "PH/RM/RW military command records <= ~40% of final gold pages."
  single_archive_cap: "Bundesarchiv <= ~60% of final gold pages (guard against single-institution monoculture)."
  license_permissive: >
    Every gold page must carry a permissive rights statement (CC0 / PD / rights-cleared). REJECT
    CC BY-NC-ND, watermarked, and InC (Urheberrechtsschutz) items - the 2026-07-02 sweep showed
    museum portals (DHM/MEK) fail this while city-archive Neustart-Kultur digitizations
    (archive.nrw METS) are CC0. Record license per page. NB: BArch Lesesaal-only material
    (data/restricted/) fails this until access + reuse terms are granted. Internet-viewable BArch
    Invenio scans are access-cleared, not reuse-cleared, unless an item/page carries an explicit
    permissive rights statement or BArch grants written reuse clearance.
  zero_public_text: >
    DECIDED 2026-07-03 (decisions_log.zero_public_text): a gold page must have NO publicly
    crawlable text layer of ANY quality (ALTO/hOCR/plain text) covering that page, and no known
    edition/transcription of its content. Garbage-grade OCR is NOT exempt - what pretraining
    crawlers did with it is unfalsifiable, and the set's "contamination-proof in both directions"
    claim needs a binary, auditable per-page answer. Consequence: SBB Feldzeitungen (uncorrected
    ALTO) are OUT of gold - demoted to Tier 4 self-training / documented-caveat extension eval.
  bestaende: ">= 6 Bestaende and >= 5 document ecologies in the frozen set."
  period_buckets: >
    >= 2 period buckets represented, and at least some pre-1850 material. Kurrent runs back to the
    16th c. and the genealogy use case is heavily 17th-19th c.; a Kurrent set that is all post-1870
    cannot support claims about older material.
  non_professional_hands: >
    >= a meaningful minimum of hands from non-professional writers (rural priests, semi-literate
    writers, women's hands, elderly hands). The "long tail of unseen hands" in VISION is mostly NOT
    trained chancery scribes.
  graphics_protocol: >
    DECIDED 2026-07-03 (decisions_log.graphics_protocol): (1) pure map/sketch/photo pages are
    EXCLUDED from the scored gold set - reading order is undefined there, so alignment-based
    page-level scoring has no well-formed ground truth; (2) mixed pages with embedded graphics
    are IN - transcribe the running text, mark graphic regions as unscored <graphic/> regions;
    (3) keep 2-3 pure map/image pages as an UNSCORED fabrication-probe annex (correct output
    ~= abstention), outside the headline benchmark. NB: current map candidates are all BArch
    (PH 10-II) = excluded with BArch; if the annex is wanted for v1, source image-dominant pages
    from the permissive pool (e.g. KCH-059 illustrated booklets).

# --- Decisions log (written BEFORE any benchmark run, per VISION section 11) --
decisions_log:
  - id: zero_public_text
    date: "2026-07-03"
    decision: >
      Public uncorrected OCR (SBB ALTO) COUNTS as contamination. Gold requires zero publicly
      crawlable text of any quality per page, plus no known edition/transcription.
    rationale: >
      The gold set's core claim is contamination-proof in both directions. "The OCR is garbage-
      grade" is an unfalsifiable defense - nobody can prove what pretraining crawlers did with
      it, and image+text pairs of those exact pages sit on a public server. A skeptical OCR-D
      reviewer asks one question: "was there public text for these pages?" The only clean answer
      is a binary NO for every page. Set is 30-50pp; purity is affordable.
    consequence: >
      SBB Kriegszeitung Borkum + Der feldgraue Bauer excluded from gold; retained on disk as
      Tier 4 self-training material and documented-caveat extension eval. degraded_fraktur gold
      rests on Solingen KCH-060/059 (one institution - mitigate by selecting across DIFFERENT
      club newsletters/printers within the volumes) + Matricula microfilm register pages as the
      second-institution hedge (rights review pending).
  - id: graphics_protocol
    date: "2026-07-03"
    decision: >
      Pure-graphics pages OUT of scored gold; embedded graphics allowed as unscored regions
      within text pages; 2-3 pure map/image pages kept as an UNSCORED fabrication-probe annex.
    rationale: >
      Maps break the METHODOLOGY, not just the engines: no defined reading order = no well-formed
      alignment ground truth for page-level CER. Bespoke scoring rules for 2-3 pages would
      undermine protocol credibility. The fabrication-trap value survives in the unscored annex -
      a map is the perfect hallucination probe (correct output ~= abstention, a headline metric)
      and costs near-zero transcription time.
  - id: barch_exclusion
    date: "2026-07-03"
    decision: "ALL Bundesarchiv material excluded from gold v1 - reuse permission unclear."
    rationale: >
      Invenio exposes no license/rights field anywhere (verified across all 23 local pulls,
      2026-07-03); official BArch Nachnutzung guidance puts reuse risk on the user. Access-
      cleared != reuse-cleared. A permissive benchmark cannot anchor on pages that cannot be
      legally cleared for reuse.
    consequence: >
      Gold v1 is 100% non-BArch. single_archive_cap and military_cap become trivially satisfied
      (only military-adjacent material left is civilian-hand Feldpost). Stratum losses and their
      covers: N 239/28 twentieth_century_kurrent flagship -> Petri 008 / Reiss / Nimlau late
      pages; PH table-registry forms -> Matricula + Merian ledgers; R 1001/R 43 marginalia ->
      cpg555 + Giessen Hs 1064h + Hainspach 1647/a. REVIVAL PATH: written BArch clearance or
      per-item PD determination; entries stay in candidates: as inventory, marked not eligible.
  - id: clean_fraktur_downgrade
    date: "2026-07-03"
    decision: "clean_fraktur DOWNGRADED from required stratum to optional; gold v1 may freeze without it."
    rationale: >
      Triple squeeze: R 150/280 failed the typeface check (Antiqua body), R 43/2404 fell with
      barch_exclusion, and zero_public_text makes replacement hard (most digitized clean Fraktur
      ships OCR by construction). VISION sections 5-6 already concede clean print to Calamari/
      OCR-D (<1% CER territory) - the stratum mostly measures a solved problem; the benchmark's
      differentiation lives in handwriting + layout-hostile strata. Not worth delaying freeze.
    consequence: >
      If cheap token coverage appears (2-3 zero-OCR clean-Fraktur pages, e.g. cleaner program/
      booklet prints inside KCH-059), take it; otherwise ship v1 with 7 strata and note the
      omission in BENCHMARK_PROTOCOL.md. Clean-Fraktur comparability is retained via the public
      GT4HistOCR / Reichsanzeiger-GT sets (VISION section 11 already includes them).


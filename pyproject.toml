[project]
name = "kurrent-pages"
version = "1.0.2"
description = "Held-out benchmark harness for mixed German historical documents"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pillow>=10", "numpy>=1.26"]
engines = ["kraken==7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]


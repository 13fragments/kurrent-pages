<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kurrent Pages link preview</title>
<!-- Source for site/public/og-image.png. Render with scripts/render_social_card.sh. -->
<style>
  @font-face { font-family: "STIX Two Text"; font-style: normal; font-weight: 400; src: url("../public/assets/fonts/stix-two-text-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "STIX Two Text"; font-style: italic; font-weight: 400; src: url("../public/assets/fonts/stix-two-text-latin-400-italic.woff2") format("woff2"); }
  @font-face { font-family: "STIX Two Text"; font-style: normal; font-weight: 600; src: url("../public/assets/fonts/stix-two-text-latin-600-normal.woff2") format("woff2"); }
  :root { --paper: #ffffff; --ink: #1c2128; --muted: #5b6470; --hair: #d5d9de; --link: #1d4f91; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body { color: var(--ink); font-family: "STIX Two Text", serif; font-variant-numeric: lining-nums; padding: 56px 80px 52px; display: flex; flex-direction: column; }

  .running-head { display: flex; justify-content: space-between; font-size: 26px; padding-bottom: 16px; border-bottom: 2px solid var(--hair); }
  .running-head .home { font-style: italic; }
  .running-head .doi { color: var(--muted); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-size: 112px; line-height: 1; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { margin-top: 20px; font-size: 36px; white-space: nowrap; line-height: 1.25; font-style: italic; color: var(--muted); }

  table { margin-top: 44px; border-collapse: collapse; font-size: 26px; }
  td { padding: 0 48px 0 0; }
  td.n { font-size: 44px; font-weight: 600; line-height: 1.1; }
  td.l { color: var(--muted); }

  footer { padding-top: 16px; border-top: 2px solid var(--hair); font-size: 26px; display: flex; justify-content: space-between; }
  footer .url { color: var(--link); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
  footer .by { color: var(--muted); }
</style>
</head>
<body>
  <header class="running-head">
    <span class="home">Kurrent Pages</span>
    <span class="doi">doi:10.5281/zenodo.24015417</span>
  </header>

  <main>
    <h1>Kurrent Pages</h1>
    <p class="subtitle">A held-out benchmark for transcribing German historical pages</p>
    <table>
      <tr><td class="n">53</td><td class="n">1565–1948</td><td class="n">Sealed</td></tr>
      <tr><td class="l">scored pages</td><td class="l">Kurrent, Sütterlin, Fraktur</td><td class="l">ground truth</td></tr>
    </table>
  </main>

  <footer>
    <span class="url">kurrentpages.org</span>
    <span class="by">Maintained by 13fragments</span>
  </footer>
</body>
</html>

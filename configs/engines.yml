# Benchmark engine configurations (protocol §6). Every scored run logs the
# exact engine version + this config into the run dir. The two VLM prompts are
# pre-registered in BENCHMARK_PROTOCOL.md §6 and MUST NOT be edited after the
# first scored run.
#
# Model files are large and live under data/raw/models/ (gitignored). Run
# `bash scripts/setup_engines.sh` before using the open CRNN incumbents.

engines:
  # --- Frontier VLM (§6 optional, unrestricted pages; §10 amendment 2026-10-31) ----
  gpt6_astra_max:                           # Codex CLI on the owner's ChatGPT subscription
    type: codex_cli
    model: gpt-6-astra
    reasoning_effort: max
    prompt_file: configs/prompts/vlm_default.txt
    timeout: 3600
    concurrency: 4                          # pages in parallel; about 15 min per page

  fable51_max:                              # Claude Code CLI on the owner's Claude subscription
    type: claude_cli
    model: claude-fable-5-1
    effort: max
    prompt_file: configs/prompts/vlm_default.txt
    timeout: 3600
    concurrency: 4

  # --- VLMs (one runner: any OpenAI-compatible chat-completions endpoint) ----
  qwen3vl_4b:
    type: vlm_openai
    base_url: http://localhost:8080/v1     # llama.cpp / lmstudio / vLLM on the Strix Halo
    model: qwen3-vl-4b-instruct
    prompt_file: configs/prompts/vlm_default.txt
    max_tokens: 4096
    temperature: 0.0
    repetition_penalty: 1.1                   # §10 amendment 2026-09-24

  qwen3vl_4b_hint:                          # pre-registered prompt variant (§6)
    type: vlm_openai
    base_url: http://localhost:8080/v1
    model: qwen3-vl-4b-instruct
    prompt_file: configs/prompts/vlm_script_hint.txt
    max_tokens: 4096
    temperature: 0.0
    repetition_penalty: 1.1                   # §10 amendment 2026-09-24

  evo_qwen25vl_3b_awq:
    type: vlm_openai
    base_url: http://localhost:8080/v1
    model: qwen2.5-vl-3b-awq
    benchmark_role: silver_stand_in
    gold_caveat: served model is Qwen2.5-VL-3B AWQ, not pre-registered §6 Qwen3-VL-4B; gold run needs Qwen3-VL-4B or a §6 amendment
    prompt_file: configs/prompts/vlm_default.txt
    max_tokens: 4096
    temperature: 0.0
    repetition_penalty: 1.1                   # §10 amendment 2026-09-24

  evo_qwen25vl_3b_awq_hint:                  # pre-registered prompt variant (§6)
    type: vlm_openai
    base_url: http://localhost:8080/v1
    model: qwen2.5-vl-3b-awq
    benchmark_role: silver_stand_in
    gold_caveat: served model is Qwen2.5-VL-3B AWQ, not pre-registered §6 Qwen3-VL-4B; gold run needs Qwen3-VL-4B or a §6 amendment
    prompt_file: configs/prompts/vlm_script_hint.txt
    max_tokens: 4096
    temperature: 0.0
    repetition_penalty: 1.1                   # §10 amendment 2026-09-24

  qwen35_4b:                                # §10 amendment 2026-09-24; served alone on the EVO
    type: vlm_openai
    base_url: http://localhost:8080/v1
    model: qwen3.5-4b
    prompt_file: configs/prompts/vlm_default.txt
    max_tokens: 4096
    temperature: 0.0
    repetition_penalty: 1.1                   # §10 amendment 2026-09-24
    chat_template_kwargs: {enable_thinking: false}   # instruct mode; transcription, not reasoning
  qwen35_4b_hint:
    type: vlm_openai
    base_url: http://localhost:8080/v1
    model: qwen3.5-4b
    prompt_file: configs/prompts/vlm_script_hint.txt
    max_tokens: 4096
    temperature: 0.0
    repetition_penalty: 1.1                   # §10 amendment 2026-09-24
    chat_template_kwargs: {enable_thinking: false}   # instruct mode; transcription, not reasoning
  # Gate 1 adapters (§10 2026-10-18): LoRA merged into Qwen3.5-4B at BF16, served alone
  # on the EVO with the qwen35_4b settings. adapter_sha256 is the adapter file's hash.

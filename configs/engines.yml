  # --- open CRNN incumbents (kill-criterion candidates, §8) ------------------
  kraken_kurrent:
    type: kraken
    package: kraken==7.0.0
    model: data/raw/models/kraken/german_kurrent.mlmodel   # setup_engines.sh: Zenodo 10.5281/zenodo.11673242 rec_bohemica.mlmodel
    timeout: 1800                            # s per subprocess; 600 timed out on G50 (2026-09-24)
    # command: ["{binary}", "-i", "{image}", "{output}", "segment", "-bl", "ocr", "-m", "{model}"]

  calamari_fraktur:
    type: calamari
    package: calamari-ocr==2.3.1
    checkpoint: data/raw/models/calamari/fraktur_historical/0.ckpt  # setup_engines.sh: Calamari-OCR/calamari_models 2.2 fraktur_historical
    predict_binary: data/raw/models/bin/calamari-predict
    kraken_binary: kraken
    timeout: 1800                            # s per subprocess; 600 timed out on G50 (2026-09-24)

  tesseract_fraktur:
    type: tesseract
    package: tesseract==5.5.2
    lang: deu_latf                            # setup_engines.sh: tessdata_best German Latin-Fraktur
    psm: 3
    extra_args: ["--tessdata-dir", "data/raw/models/tessdata"]

  # --- registered but unimplemented (fail loudly with instructions) ----------
  pylaia:
    type: pylaia

  # Transkribus via the web app (no API on the plan); exports read back per page.
  # Models fixed 2026-09-24 before any run (§6). Budget: 300 credits total
  # (50 free until 2026-10-24 + 250 bought), 1 credit per page per model.
  transkribus_text_titan_ii:
    type: transkribus
    model: Text Titan II
    model_id: 579509
    export_dir: evals/transkribus_exports/text_titan_ii
    credit_cap: 61
  transkribus_german_genius:
    type: transkribus
    model: German Genius (Super Model)
    model_id: 265149
    export_dir: evals/transkribus_exports/german_genius
    credit_cap: 61


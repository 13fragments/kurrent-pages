  gate1_run11_s800:                         # Gate 1 release candidate: Run 11, step 800 (§10 2026-10-25)
    type: vlm_openai
    base_url: http://localhost:8080/v1
    model: gate1-run11-s800
    base_model: Qwen/Qwen3.5-9B
    adapter_sha256: a7347b697edd9beecfeeadc357d701cd7216f2400077fcd769598d23633f0276
    prompt_file: configs/prompts/vlm_default.txt
    max_tokens: 4096
    temperature: 0.0
    repetition_penalty: 1.1                   # §10 amendment 2026-09-24
    chat_template_kwargs: {enable_thinking: false}   # instruct mode; transcription, not reasoning
  gate2_p1_s2400:                           # Gate 2 Round 0: model-track P1, step 2400 (§10 2026-11-06)
    type: vlm_openai
    base_url: http://localhost:8080/v1
    model: gate2-p1-s2400
    base_model: lightonai/LightOnOCR-3-1B
    adapter_sha256: 07fd8279f0a8e2bf2e850955f48939dbd41e0913a285fc23ee82231a36af60ac   # full trained weights
    prompt_file: configs/prompts/vlm_default.txt   # hash recorded; not sent (image_only)
